<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 🛡️ Sentinel: Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://esm.sh 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        connect-src 'self' https://esm.sh https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com;
        img-src 'self' blob: data: https:;
        media-src 'self' blob: data: https:;
        frame-src 'none';
        object-src 'none';
    ">
    <title>Stream Quest</title>

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Press+Start+2P&amp;display=swap"
        rel="stylesheet" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <style>
        body {
            background-color: #05080c;
            color: white;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            background: #0a0f16;
        }

        ::-webkit-scrollbar-track {
            background: #0c1219;
            border-left: 1px solid #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #2b6cee;
            border-radius: 4px;
            border: 1px solid #0a0f16;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ffd700;
        }

        /* RPG Window Style */
        .rpg-window {
            background: linear-gradient(180deg, #2b6cee 0%, #1e3a8a 100%);
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 2px #000000, 4px 4px 0px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .rpg-window-gold {
            border-color: #ffd700;
        }

        /* Button Press Effect */
        .btn-pixel:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px rgba(0, 0, 0, 0);
        }

        /* Range Slider Customization */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 0px;
            background: #ffd700;
            border: 2px solid white;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 2px 2px 0 #000;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #1e3a8a;
            border: 1px solid #475569;
        }

        /* CRT Screen Animations */
        @keyframes crt-turn-on {
            0% {
                transform: scale(1, 0.001) translate3d(0, 0, 0);
                filter: brightness(30);
                opacity: 0;
            }

            30% {
                transform: scale(1, 0.001) translate3d(0, 0, 0);
                filter: brightness(30);
                opacity: 1;
            }

            60% {
                transform: scale(1, 0.001) translate3d(0, 0, 0);
                filter: brightness(30);
                opacity: 1;
            }

            100% {
                transform: scale(1, 1) translate3d(0, 0, 0);
                filter: brightness(1);
                opacity: 1;
            }
        }

        @keyframes crt-turn-off {
            0% {
                transform: scale(1, 1) translate3d(0, 0, 0);
                filter: brightness(1);
                opacity: 1;
            }

            60% {
                transform: scale(1, 0.001) translate3d(0, 0, 0);
                filter: brightness(10);
                opacity: 1;
            }

            100% {
                transform: scale(0, 0.001) translate3d(0, 0, 0);
                filter: brightness(0);
                opacity: 0;
            }
        }

        @keyframes static-noise {
            0% {
                background-position: 0 0;
            }

            10% {
                background-position: -5% -10%;
            }

            20% {
                background-position: -15% 5%;
            }

            30% {
                background-position: 7% -25%;
            }

            40% {
                background-position: 20% 25%;
            }

            50% {
                background-position: -25% 10%;
            }

            60% {
                background-position: 15% 5%;
            }

            70% {
                background-position: 0% 15%;
            }

            80% {
                background-position: 25% 35%;
            }

            90% {
                background-position: -10% 10%;
            }

            100% {
                background-position: 0 0;
            }
        }

        .animate-crt-on {
            animation: crt-turn-on 0.2s linear forwards;
        }

        .animate-crt-off {
            animation: crt-turn-off 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        .animate-static-noise {
            position: absolute;
            inset: 0;
            opacity: 0.8;
            z-index: 20;
            background-image: repeating-radial-gradient(circle at 17% 32%, white, black 0.00085px);
            background-size: 250% 250%;
            animation: static-noise 0.3s steps(5) infinite;
            pointer-events: none;
            mix-blend-mode: hard-light;
        }

        /* Secondary Screen Layout Transition */
        .secondary-screen-container {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 250px;
            /* Approximate height of 16:9 video + padding */
            opacity: 1;
            transform: translateY(0);
        }
    </style>
    <!-- 🛡️ Sentinel: External Import Map -->
    <script type="importmap" src="/importmap.json"></script>
    <link rel="stylesheet" href="/index.css">
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
